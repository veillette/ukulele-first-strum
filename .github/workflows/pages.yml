name: Check and deploy Ukulele Starter

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: ./.github/workflows/site-ci.yml
    with:
      output: dist
      node-version: '24'
      check: npm run check
      build: npm run build
      browser-tests: npm run test:browser
